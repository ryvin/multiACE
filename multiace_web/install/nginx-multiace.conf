# multiACE Web Console — drop in /etc/nginx/fluidd.d/multiace.conf
# Loaded from the fluidd `server { listen 80; }` block via:
#   include /etc/nginx/fluidd.d/*.conf;
# (see /etc/nginx/sites-available/fluidd line ~99)
# $connection_upgrade is defined in /etc/nginx/conf.d/common_vars.conf.

location /multiace/ {
    proxy_pass http://127.0.0.1:7126/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}
